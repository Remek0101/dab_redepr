resources:
  jobs:
    citibike_etl_script:
      name: citibike_etl_script
      tasks:
        - task_key: 01_bronze_citibike
          spark_python_task:
            python_file: ../citibike_etl/scripts/01_bronze_citibike.py
            parameters:
              - "{{job.id}}"
              - "{{job.run_id}}"
              - "{{task.run_id}}"
              - "{{job.start_time.iso_datetime}}"
              - "${var.catalog}"  # this refers to the databricks yml variable 'catalog', we will override it to test/prod on deployment
          job_cluster_key: ds3_v2_sn

        - task_key: 02_silver_citibike
          depends_on:
            - task_key: 01_bronze_citibike
          spark_python_task:
            python_file: ../citibike_etl/scripts/02_silver_citibike.py
            parameters:
              - "{{job.id}}"
              - "{{job.run_id}}"
              - "{{task.run_id}}"
              - "{{job.start_time.iso_datetime}}"
              - "${var.catalog}"  # this refers to the databricks yml variable 'catalog', we will override it to test/prod on deployment
          job_cluster_key: ${var.cluster}   # ds3_v2_sn in dev, d8s_v3_sn in test/prod
          libraries: 
            - whl: ../dist/*.whl  # path to the built wheel file for the dab_redepr package

        - task_key: 03_gold_citibike
          depends_on:
            - task_key: 02_silver_citibike
          spark_python_task:
            python_file: ../citibike_etl/scripts/03_gold_citibike.py
            parameters:
              - "${var.catalog}"  # this refers to the databricks yml variable 'catalog', we will override it to test/prod on deployment
          job_cluster_key: ${var.cluster}   # ds3_v2_sn in dev, d8s_v3_sn in test/prod

      job_clusters:
        - job_cluster_key: ds3_v2_sn
          new_cluster: ${var.ds3_v2_sn}
        - job_cluster_key: d4s_v3_sn
          new_cluster: ${var.d4s_v3_sn}

      queue:
        enabled: true
